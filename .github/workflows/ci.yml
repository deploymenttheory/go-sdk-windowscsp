name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Build everything (including all generated packages)
        run: go build ./...

      - name: Vet
        run: go vet ./cmd/... ./internal/... ./windowscsp/... ./examples/...

      - name: Test
        run: go test ./cmd/... ./internal/... ./windowscsp/

      - name: Test runtime packages
        run: go test ./windowscsp/client/ ./windowscsp/clienttest/ ./windowscsp/syncml/

  regen:
    name: Regeneration determinism gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Regenerate the SDK surface from committed snapshots
        run: go run ./cmd/gencsp

      - name: Generated output must match the committed tree
        run: |
          git add -N windowscsp
          git diff --exit-code --stat -- windowscsp
