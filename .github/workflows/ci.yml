name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Build everything (including all generated packages)
        run: go build ./...

      - name: Vet
        run: go vet ./cmd/... ./internal/... ./windowscsp/... ./examples/...

      - name: Test
        run: go test ./cmd/... ./internal/... ./windowscsp/

      - name: Test runtime packages
        run: go test ./windowscsp/client/ ./windowscsp/clienttest/ ./windowscsp/syncml/

  regen:
    name: Regeneration determinism gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Regenerate the SDK surface from committed snapshots
        run: go run ./cmd/gencsp

      - name: Generated output must match the committed tree
        run: |
          git add -N windowscsp
          git diff --exit-code --stat -- windowscsp
